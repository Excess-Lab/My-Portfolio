<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>макар кабанов — продуктовый дизайнер</title>
    <meta name="description" content="Портфолио продуктового дизайнера Макара Кабанова." />
    <meta name="theme-color" content="#e7e7e7" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="макар кабанов — продуктовый дизайнер" />
    <meta property="og:description" content="Портфолио продуктового дизайнера Макара Кабанова." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Martian+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Фильтр «разрушенного» текста. Турбулентный шум смещает контур глифа:
         baseFrequency задаёт размер зерна, scale — глубину съедания края.
         Живёт в разметке, а не в компоненте, чтобы им мог пользоваться любой
         текст на любой секции сайта. -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <!-- Рваный морф: тем же турбулентным шумом, что рвёт края букв, но с
           крупным смещением — новый экран собирается из разорванного изображения.
           Величину смещения (scale) анимирует main.js. -->
      <filter id="morph-tear">
        <feTurbulence
          id="morph-tear-noise"
          type="fractalNoise"
          baseFrequency="0.006 0.03"
          numOctaves="2"
          result="noise"
        />
        <feDisplacementMap
          id="morph-tear-map"
          in="SourceGraphic"
          in2="noise"
          scale="0"
          xChannelSelector="R"
          yChannelSelector="G"
          result="torn"
        />
        <feGaussianBlur id="morph-tear-blur" in="torn" stdDeviation="0" />
      </filter>

      <filter id="rough-text">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <loading-screen></loading-screen>
    <hero-tear></hero-tear>

    <!-- Основной сайт: экраны на весь вьюпорт, скролла между ними нет. -->
    <main id="site" hidden class="relative h-[100svh] w-full bg-canvas"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
